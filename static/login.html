<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* سیستم فونت آیفون (SF Pro) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #030304;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* افکت مایع شیشه‌ای - iOS 26 Liquid Glass */
        .liquid-glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 30, 39, 0.03) 100%), rgba(12, 12, 16, 0.55);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 30px 80px -10px rgba(0, 0, 0, 0.9),
                0 0 50px -10px rgba(255, 30, 39, 0.25),
                inset 0 1px 1px rgba(255, 255, 255, 0.3),
                inset 0 -1px 2px rgba(255, 30, 39, 0.3);
            animation: cardFloat 6s ease-in-out infinite alternate;
        }

        /* ورودی‌های بیضی‌شکل کشیده شیشه‌ای */
        .glass-pill-input {
            background: rgba(20, 20, 25, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-pill-input:focus-within {
            background: rgba(30, 30, 38, 0.6);
            border-color: rgba(255, 30, 39, 0.8);
            box-shadow: 
                0 0 25px rgba(255, 30, 39, 0.4),
                inset 0 0 10px rgba(255, 30, 39, 0.15);
            transform: scale(1.02);
        }

        /* دکمه اکشن با انیمیشن لمس آیفونی (Haptic Feedback) */
        .ios-action-btn {
            background: linear-gradient(135deg, #FF1E27 0%, #990007 100%);
            box-shadow: 
                0 10px 30px rgba(255, 30, 39, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ios-action-btn:active {
            transform: scale(0.94);
            box-shadow: 0 4px 15px rgba(255, 30, 39, 0.6);
        }

        /* شناوری ملایم کارت */
        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* نور پس‌زمینه پویا */
        .ambient-glow-red {
            background: radial-gradient(circle, rgba(255, 30, 39, 0.22) 0%, rgba(0,0,0,0) 70%);
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.15); }
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative text-white bg-black">

    <!-- هاله‌های نوری شناور پس‌زمینه -->
    <div class="absolute w-[500px] h-[500px] ambient-glow-red rounded-full blur-3xl pointer-events-none"></div>

    <!-- قالب اصلی مربع‌طور (Liquid Glass Card) -->
    <main class="liquid-glass-card relative z-10 w-[90%] max-w-[400px] aspect-square rounded-[42px] p-7 flex flex-col justify-between items-center">
        
        <!-- لوگوی مینیمال عنکبوت قرمز و مشکی -->
        <div class="flex flex-col items-center mt-1">
            <div class="relative w-14 h-14 rounded-2xl bg-gradient-to-b from-zinc-900 to-black border border-red-600/30 flex items-center justify-center shadow-lg shadow-red-950/60 mb-2">
                <svg class="w-9 h-9 text-red-600 drop-shadow-[0_0_10px_rgba(255,30,39,0.9)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <!-- بدنه و سر عنکبوت -->
                    <ellipse cx="12" cy="15" rx="3" ry="4" fill="#09090b" stroke="#FF1E27"/>
                    <circle cx="12" cy="9" r="2" fill="#FF1E27" stroke="#FF1E27"/>
                    <!-- پاهای عنکبوت -->
                    <path d="M9 9C6 7 4 8 3 10" />
                    <path d="M15 9C18 7 20 8 21 10" />
                    <path d="M9 13C5 12 3 14 2 17" />
                    <path d="M15 13C19 12 21 14 22 17" />
                    <path d="M9 15C5 16 3 19 2 22" />
                    <path d="M15 15C19 16 21 19 22 22" />
                </svg>
            </div>
            
            <!-- فونت خوشامدگویی به ادمین -->
            <h1 class="text-xl font-extrabold tracking-tight text-white/95 drop-shadow-sm">Welcome Admin</h1>
            <p class="text-[11px] text-zinc-400 font-medium mt-0.5">وارد حساب کاربری خود شوید</p>
        </div>

        <!-- فرم ورود (دو ورودی بیضی‌شکل) -->
        <form class="w-full flex flex-col gap-3.5 my-auto" onsubmit="event.preventDefault();">
            
            <!-- ورودی نام کاربری -->
            <div class="glass-pill-input w-full h-11 rounded-full px-5 flex items-center gap-3">
                <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <input type="text" placeholder="نام کاربری" required
                    class="bg-transparent w-full h-full text-xs text-white placeholder-zinc-500 focus:outline-none text-right">
            </div>

            <!-- ورودی رمز عبور -->
            <div class="glass-pill-input w-full h-11 rounded-full px-5 flex items-center gap-3">
                <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <input type="password" placeholder="رمز عبور" required
                    class="bg-transparent w-full h-full text-xs text-white placeholder-zinc-500 focus:outline-none text-right">
            </div>

            <!-- دکمه ورود آیفونی -->
            <button type="submit" 
                class="ios-action-btn w-full h-11 rounded-full font-bold text-xs tracking-wide text-white mt-1 flex items-center justify-center gap-2 cursor-pointer">
                <span>ورود</span>
                <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </form>

        <!-- زیرنویس امنیتی -->
        <div class="flex items-center gap-1.5 opacity-40 hover:opacity-80 transition-opacity cursor-default">
            <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
            <span class="text-[9px] text-zinc-400 font-mono tracking-wider">SYSTEM SECURED</span>
        </div>
    </main>

</body>
</html>
