<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pars Space · Login</title>
<style>
:root{--bg:#f3f4f6;--card:rgba(255,255,255,.78);--text:#111;--muted:#70747b;--line:rgba(0,0,0,.09);--soft:#eceef1;--accent:#111;--accentText:#fff}
[data-theme=dark]{--bg:#0c0d0f;--card:rgba(25,26,29,.8);--text:#f5f5f5;--muted:#999da5;--line:rgba(255,255,255,.1);--soft:#222428;--accent:#f5f5f5;--accentText:#111}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden}.bg{position:fixed;inset:-10%;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.7),transparent 35%),var(--bg)}
[data-theme=dark] .bg{background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.04),transparent 35%),var(--bg)}
.bg:after{content:"";position:absolute;width:46vw;height:46vw;border:1px solid var(--line);border-radius:50%;left:-10vw;bottom:-18vw;animation:loginOrb 14s ease-in-out infinite}@keyframes loginOrb{50%{transform:translate(4vw,-3vw) scale(1.05)}}.shell{direction:ltr;position:relative;width:min(1080px,94vw);min-height:650px;display:grid;grid-template-columns:.95fr 1.05fr;border:1px solid var(--line);border-radius:32px;overflow:hidden;background:var(--card);backdrop-filter:blur(34px) saturate(145%);box-shadow:0 35px 110px rgba(0,0,0,.18)}
.visual{position:relative;overflow:hidden;min-height:650px;background:#090b0f}.visual:before{content:"";position:absolute;inset:-30%;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.09) 50%,transparent 60%);z-index:1;animation:loginSweep 9s ease-in-out infinite}@keyframes loginSweep{55%,100%{transform:translateX(35%)}}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.18) 55%,rgba(0,0,0,.62))}.visual img{width:100%;height:100%;object-fit:cover;image-rendering:auto;filter:saturate(.85) contrast(1.04);opacity:.96}.visualText{position:absolute;z-index:2;left:35px;bottom:32px;color:white}.visualText small{letter-spacing:.22em;font-size:10px;opacity:.65}.visualText h2{margin:8px 0 0;font-size:34px;letter-spacing:-.06em}
.formSide{direction:rtl;text-align:right;padding:52px 46px;display:flex;flex-direction:column;justify-content:center}.brand{font-weight:900;letter-spacing:-.06em;font-size:17px;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-weight:900}.eyebrow{margin-top:50px;color:var(--muted);font-size:11px;letter-spacing:.18em}.title{font-size:48px;line-height:.95;letter-spacing:-.075em;margin:10px 0 12px}.desc{color:var(--muted);font-size:13px;line-height:1.8;margin-bottom:28px}.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-size:11px;color:var(--muted)}input{width:100%;padding:14px 15px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--text);box-shadow:0 0 0 4px rgba(0,0,0,.06)}.submit{position:relative;overflow:hidden;width:100%;border:0;border-radius:15px;padding:14px;background:var(--accent);color:var(--accentText);font:inherit;font-weight:800;cursor:pointer;margin-top:7px}.submit:before{content:"";position:absolute;inset:-100% 40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);transform:translateX(-160%);transition:transform .5s}.submit:hover:before{transform:translateX(160%)}.submit:hover{transform:translateY(-2px);box-shadow:0 16px 35px rgba(0,0,0,.18)}.tool:hover{transform:translateY(-2px);background:var(--soft);color:var(--text)}.submit:disabled{opacity:.6}.error{min-height:20px;margin-top:12px;color:#b42318;font-size:12px}.tools{display:flex;gap:7px;margin-top:25px}.tool{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:8px 10px;cursor:pointer}
@media(max-width:800px){.shell{grid-template-columns:1fr;min-height:auto}.visual{display:block;min-height:230px;max-height:260px}.visualText{left:22px;bottom:20px}.formSide{padding:32px 24px}.formSide{padding:38px 25px}html[dir=ltr] .formSide{direction:ltr;text-align:left}.eyebrow{margin-top:38px}.title{font-size:42px}}
html[dir=ltr] .formSide{direction:ltr;text-align:left}
</style>
</head>
<body><div class="bg"></div>
<div class="shell">
 <section class="visual"><img src="/static/pars-space-pixel.jpg" alt="Pars Space"><div class="visualText"><small>PARS SPACE</small><h2>Persian legacy.<br>Modern control.</h2></div></section>
 <section class="formSide">
  <div class="brand"><span class="logo">P</span><span>PARS SPACE</span></div>
  <div class="eyebrow" id="welcomeEyebrow">CONTROL CENTER</div><div class="title" id="welcomeTitle">Welcome<br>back.</div>
  <div class="desc">وارد پنل مدیریتی Pars Space شوید.</div>
  <form id="loginForm">
   <div class="field"><label>نام کاربری</label><input id="username" autocomplete="username" placeholder="admin" required></div>
   <div class="field"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
   <button class="submit" id="submit">ورود به پنل</button><div class="error" id="error"></div>
  </form>
  <div class="tools"><button class="tool" id="theme">◐ تم</button><button class="tool" id="lang">EN</button></div>
 </section>
</div>
<script>
const $=s=>document.querySelector(s);let theme=localStorage.getItem('ps_theme')||'system';
function applyTheme(){let t=theme;if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}
applyTheme();const welcomes=['Welcome\nback.','Good to see you.','Ready when you are.','Control starts here.'];let w=welcomes[Math.floor(Math.random()*welcomes.length)].split('\n');$('#welcomeTitle').innerHTML=w.join('<br>');$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('ps_theme',theme);applyTheme()};
$('#lang').onclick=()=>{document.documentElement.lang='en';document.documentElement.dir='ltr';document.querySelector('.desc').textContent='Sign in to your Pars Space control center.';document.querySelector('.eyebrow').textContent='CONTROL CENTER';document.querySelector('.submit').textContent='Sign in';document.querySelectorAll('.field label')[0].textContent='Username';document.querySelectorAll('.field label')[1].textContent='Password';$('#lang').textContent='FA'};
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#error').textContent='';$('#submit').disabled=true;try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:$('#username').value.trim(),password:$('#password').value})});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'ورود ناموفق بود');location.href='/dashboard'}catch(err){$('#error').textContent=err.message}finally{$('#submit').disabled=false}};
</script>
</body></html>
